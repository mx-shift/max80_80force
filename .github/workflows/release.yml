# On a tag push: build the game's boot disks and attach them to a
# GitHub release named after the tag.
name: release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

env:
  SJASMPLUS_VERSION: v1.24.0

jobs:
  disks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache sjasmplus
        id: sjasmplus
        uses: actions/cache@v4
        with:
          path: ~/sjasmplus-bin
          key: sjasmplus-${{ env.SJASMPLUS_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Build sjasmplus
        if: steps.sjasmplus.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$SJASMPLUS_VERSION" \
            https://github.com/z00m128/sjasmplus.git "$RUNNER_TEMP/sjasmplus"
          cd "$RUNNER_TEMP/sjasmplus"
          git submodule update --init --depth 1
          make -j"$(nproc)"
          install -D -m 755 sjasmplus ~/sjasmplus-bin/sjasmplus

      - name: Build the disks
        run: |
          export PATH="$HOME/sjasmplus-bin:$PATH"
          sh build.sh
          mkdir dist
          cp build/proto.imd "dist/80force-$GITHUB_REF_NAME-8in.imd"
          cp build/proto_525.imd "dist/80force-$GITHUB_REF_NAME-525.imd"

      - uses: actions/upload-artifact@v4
        with:
          name: 80force-${{ github.ref_name }}
          path: dist/*.imd
          if-no-files-found: error

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.imd \
            --verify-tag --title "80-Force $GITHUB_REF_NAME" --generate-notes
